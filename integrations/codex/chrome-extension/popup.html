<!doctype html><html><head><meta charset="utf-8"><title>Rock</title>
<style>body{font:14px system-ui;width:310px;padding:18px;background:#132021;color:#edf6f5}h1{margin:0 0 12px}button{padding:10px;margin:5px 0;width:100%;border:0;border-radius:6px;cursor:pointer}p{line-height:1.45}#status{color:#82dfca}li{overflow-wrap:anywhere;margin:5px 0}</style></head>
<body><h1>Rock</h1><p id="status">Connecting…</p>
<p>Rock works in background tabs. Share your current tab when you want Rock to use it. Other tabs stay private.</p>
<button id="connect">Connect Rock</button><button id="share">Share this tab with Rock</button>
<button id="revoke">Stop sharing this tab</button><button id="disconnect">Disconnect Rock</button>
<p>Tabs Rock can use:</p><ul id="tabs"></ul><script src="popup.js"></script></body></html>
